# Headless Service (clusterIP: None): no load-balanced virtual IP.
# Instead, every pod of the StatefulSet gets its own DNS name:
#   web-0.web.default.svc.cluster.local, web-1.web.default.svc.cluster.local, ...
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  clusterIP: None
  selector:
    app: web
  ports:
  - name: http
    port: 80
