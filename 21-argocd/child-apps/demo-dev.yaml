# Child Application managed by root-app (argocd-app-of-apps.yaml): demo-app in namespace demo-dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/utrains/kubernetes-practice2.git
    targetRevision: main
    path: 21-argocd/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
