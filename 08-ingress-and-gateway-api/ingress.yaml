apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-app-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"   # http:// is redirected to https://
    # No certificate-arn needed: the controller picks the ACM certificate that matches the hosts below
    # (here the wildcard *.afriqhome.com). You can still force one with:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:<account-id>:certificate/<id>
spec:
  ingressClassName: alb                    # MODERN (K8s 1.22+); replaces the old kubernetes.io/ingress.class annotation
  rules:
  - host: app1.afriqhome.com      # replace with your own subdomain (ExternalDNS creates the record)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service
            port:
              number: 80
  - host: app2.afriqhome.com      # replace with your own subdomain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app2-service
            port:
              number: 80