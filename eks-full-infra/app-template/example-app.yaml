# App request template.
# Copy this file to eks-full-infra/apps/<name>-<env>.yaml, fill it in, open a pull request.
# After the merge, ArgoCD deploys the app within ~3 minutes at:
#   https://<name>-<env>.<domain>        (env = prod: https://<name>.<domain>)
#
# REQUIRED -------------------------------------------------------------------
name: myapp          # lowercase letters, digits, "-" (2-30 chars, starts with a letter)
env: dev             # dev | staging | prod

# OPTIONAL (defaults shown) ----------------------------------------------------
# image: nginx:1.27  # your container image, with a pinned tag
# port: 80           # port the container listens on
# replicas: 2
# healthPath: /      # readiness/liveness probe path
# env_vars:          # extra environment variables
#   LOG_LEVEL: info
# resources:
#   requests: {cpu: 50m, memory: 64Mi}
#   limits: {memory: 256Mi}
# autoscaling:
#   enabled: false
#   minReplicas: 2
#   maxReplicas: 6
#   cpuTarget: 70
#
# Everything else is created for you:
#   namespace <name>-<env> (Istio sidecars, mTLS), Deployment <name>, Service <name>,
#   PodDisruptionBudget, TLS certificate <name>-<env>-tls, Gateway listener, HTTPRoute,
#   HTTP->HTTPS redirect, DNS record.
