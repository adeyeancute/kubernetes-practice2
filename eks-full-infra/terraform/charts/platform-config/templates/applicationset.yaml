# One ArgoCD Application per app request file {{ .Values.gitops.appsPath }}/<name>/<env>.yaml
#   <name> = the folder name, <env> = the file name without .yaml (they override the file content)
#   the file gives the image, port, replicas...; the chart {{ .Values.gitops.chartPath }} derives the rest.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.gitops.repoURL }}
        revision: {{ .Values.gitops.revision }}
        files:
          - path: "{{ .Values.gitops.appsPath }}/*/*.yaml"
  template:
    metadata:
      # Application / namespace names are sanitized so that ONE badly named folder can never block
      # the whole ApplicationSet. The chart still gets the raw name and fails only that app, with a clear message.
      name: '{{`{{ regexReplaceAll "[^a-z0-9-]" (lower .path.basename) "-" }}-{{ regexReplaceAll "[^a-z0-9-]" (lower (trimSuffix ".yaml" .path.filename)) "-" }}`}}'
      labels:
        app.kubernetes.io/part-of: apps
      finalizers:
        - resources-finalizer.argocd.argoproj.io   # deleting the app deletes everything it created
    spec:
      project: default
      source:
        repoURL: {{ .Values.gitops.repoURL }}
        targetRevision: {{ .Values.gitops.revision }}
        path: {{ .Values.gitops.chartPath }}
        helm:
          releaseName: '{{`{{ regexReplaceAll "[^a-z0-9-]" (lower .path.basename) "-" }}`}}'
          values: |
            platform:
              domain: {{ .Values.domain }}
              clusterIssuer: letsencrypt
              storageClasses:
                shared: efs     # EFS, ReadWriteMany
                disk: gp3       # EBS, ReadWriteOnce
              ingress:
                namespace: {{ .Values.ingress.namespace }}
                serviceDNS: {{ .Values.ingress.serviceDNS }}
                lbHostname: {{ .Values.ingress.lbHostname }}
            app: {{`{{ toJson (merge (dict "name" .path.basename "env" (trimSuffix ".yaml" .path.filename)) (omit . "path")) }}`}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{ regexReplaceAll "[^a-z0-9-]" (lower .path.basename) "-" }}-{{ regexReplaceAll "[^a-z0-9-]" (lower (trimSuffix ".yaml" .path.filename)) "-" }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # no CreateNamespace: the chart creates the Namespace (with istio-injection), so Argo CD
        # also deletes it when the app is removed
