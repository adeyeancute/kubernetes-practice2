# this pod sets no resources: the LimitRange fills in the defaults
apiVersion: v1
kind: Pod
metadata:
  name: pod-defaults
  namespace: limits-demo
spec:
  containers:
  - name: nginx
    image: nginx:1.27
---
# this pod won't be created: its memory limit is above the LimitRange max (512Mi)
apiVersion: v1
kind: Pod
metadata:
  name: pod-too-big
  namespace: limits-demo
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
