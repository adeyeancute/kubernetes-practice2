# pod-configmap-arg.yaml
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  default_command: "date"
---
apiVersion: v1
kind: Pod
metadata:
  name: app-config-pod
spec:
  restartPolicy: Never   # the command runs once and exits: do not restart it
  containers:
    - name: app-container
      image: busybox:1.36
      command: ["/bin/sh", "-c", "$(STARTUP_COMMAND)"]
      env:
       - name: STARTUP_COMMAND
         valueFrom:
           configMapKeyRef:
             name: app-config
             key: default_command