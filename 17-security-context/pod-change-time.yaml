apiVersion: v1
kind: Pod
metadata:
  name: pod-change-time
spec:
  containers:
  - name: main
    image: alpine:3.20
    command: ["/bin/sh", "-c", "sleep 3600"]
    securityContext:
      capabilities:
        # NEVER "add: [SYS_TIME]" here: containers share the node kernel clock, so a container
        # with SYS_TIME can change the time of the whole NODE (and break its TLS certificates).
        drop:
        - SYS_TIME