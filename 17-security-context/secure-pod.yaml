apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
spec:
  securityContext:   # Pod-level security context
    runAsNonRoot: true          # required by the PSA "restricted" level
    seccompProfile:
      type: RuntimeDefault      # required by "restricted": filter dangerous Linux syscalls
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - name: secure-container
    image: alpine:3.20
    command: ["/bin/sh", "-c", "sleep 3600"]
    securityContext:  # Container-level security context
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]