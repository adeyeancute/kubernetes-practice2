apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: your-efs-filesystem-id   # replaced on the fly by the command in readme.md
  directoryPerms: "700"
#
#
# Replace **your-efs-filesystem-id** with the **FileSystemId** obtained earlier. Apply this configuration:
#
# Apply the object in the cluster
#
# sed "s/your-efs-filesystem-id/$EFS_ID/" efs-storage-class.yaml | kubectl apply -f -
# kubectl get storageclass