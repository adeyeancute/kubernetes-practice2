## Pod that uses the SAME PVC, forced onto ANOTHER node in the SAME availability zone.
## While pod-ebs is running it stays in ContainerCreating (EBS = ReadWriteOnce: one node at a time).
## As soon as pod-ebs is deleted, the volume moves to this node and the pod starts.
apiVersion: v1
kind: Pod
metadata:
  name: pod-ebs2
spec:
  nodeName: NODE_SAME_ZONE   # replaced on the fly by the command in readme.md
  containers:
  - name: app
    image: busybox:1.36
    command: [ "sh", "-c", "echo 'Hello from pod-ebs2 (same zone)!' >> /data/test.txt && sleep 3600" ]
    volumeMounts:
    - mountPath: "/data"
      name: storage
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: ebs-pvc
