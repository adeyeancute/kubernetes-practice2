# A DestinationRule names the versions ("subsets") of a service, using pod labels
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: web
  namespace: mesh-demo
spec:
  host: web            # the Kubernetes Service name
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
