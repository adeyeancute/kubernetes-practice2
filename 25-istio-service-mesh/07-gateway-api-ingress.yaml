# Istio as a Gateway API implementation (same API as chapter 07, different controller).
# Istio creates a gateway Deployment + a LoadBalancer Service for this Gateway automatically.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: mesh-demo
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
# The same 90/10 canary, written with the portable Gateway API instead of a VirtualService
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: mesh-demo
spec:
  parentRefs:
  - name: web-gateway
  rules:
  - backendRefs:
    - name: web-v1
      port: 80
      weight: 90
    - name: web-v2
      port: 80
      weight: 10
---
# HTTPRoute splits between Services, so each version gets its own Service
apiVersion: v1
kind: Service
metadata:
  name: web-v1
  namespace: mesh-demo
spec:
  selector:
    app: web
    version: v1
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: mesh-demo
spec:
  selector:
    app: web
    version: v2
  ports:
  - name: http
    port: 80
    targetPort: 8080
