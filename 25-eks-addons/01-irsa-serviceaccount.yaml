# A Pod that gets AWS permissions through IRSA (IAM Roles for Service Accounts).
#
# Prereqs (run before applying this file):
#   eksctl utils associate-iam-oidc-provider --cluster my-cluster --approve
#   eksctl create iamserviceaccount \
#     --cluster my-cluster --namespace default --name s3-reader-sa \
#     --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess --approve
#
# eksctl creates the IAM role AND the ServiceAccount, with this annotation:
#
#   apiVersion: v1
#   kind: ServiceAccount
#   metadata:
#     name: s3-reader-sa
#     namespace: default
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/eksctl-my-cluster-addon-iamserviceaccount-...
#
# That is why the ServiceAccount is NOT in this file: applying a ServiceAccount here would
# overwrite the annotation eksctl just wrote, and the Pod would lose its AWS permissions.
apiVersion: v1
kind: Pod
metadata:
  name: s3-reader
  namespace: default
spec:
  serviceAccountName: s3-reader-sa    # The Pod inherits the ServiceAccount's IAM permissions.
  containers:
    - name: aws-cli
      image: amazon/aws-cli:2.27.0
      command: ["sleep", "3600"]
      # Inside this Pod:
      #   aws sts get-caller-identity   ==> the IAM role, not a user
      #   aws s3 ls                     ==> uses the IAM role, no access keys anywhere.
