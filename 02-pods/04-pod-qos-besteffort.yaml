# pod-qos-besteffort.yaml
#
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  labels:
   app: utrains
spec:
  containers:
    - name: nginx
      image: nginx:1.27
#
# Creating a simple pod with the nginx image. 
# There are no cpu or memory limits applied on pod. 
#
# QoS = Best Effort 
#
#
# run the pod
# kubectl create -f pod-qos-besteffort.yaml
#
# check the pod
# kubectl get pods
#
# get details about pod
# kubectl describe pod/qos-besteffort
# 
# Check the "QoS Class" value. 
#
# delete pod
# kubectl delete pod/qos-besteffort
#